services:
  postgres:
    image: postgres:16-alpine
    container_name: enduro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enduro
      POSTGRES_PASSWORD: enduro
      POSTGRES_DB: enduro
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enduro']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
